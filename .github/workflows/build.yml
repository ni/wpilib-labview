name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The shim libraries (src/), built like WPILib builds its own native code: Linux in WPILib's
  # containers (docker/wpilib-*), Windows and macOS on their runners
  shims-linux:
    strategy:
      fail-fast: false
      matrix:
        platform: [ linuxsystemcore, linuxx86-64, linuxarm64 ]
    name: Shims - ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build shims
        env:
          PLATFORM: ${{ matrix.platform }}
        run: scripts/docker-shims.sh "$PLATFORM"
      - uses: actions/upload-artifact@v7
        with:
          name: shims-${{ matrix.platform }}
          path: build/shims/shims-${{ matrix.platform }}/
          if-no-files-found: error

  shims-windows:
    strategy:
      fail-fast: false
      matrix:
        platform: [ windowsx86-64, windowsarm64 ]
    name: Shims - ${{ matrix.platform }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Build shims
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          PYTHON: python
        run: scripts/build-shims.sh "$PLATFORM"
      - uses: actions/upload-artifact@v7
        with:
          name: shims-${{ matrix.platform }}
          path: build/shims/shims-${{ matrix.platform }}/
          if-no-files-found: error

  shims-macos:
    name: Shims - osxuniversal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Build shims
        run: scripts/build-shims.sh osxuniversal
      - uses: actions/upload-artifact@v7
        with:
          name: shims-osxuniversal
          path: build/shims/shims-osxuniversal/
          if-no-files-found: error

  build:
    needs: [ shims-linux, shims-windows, shims-macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # actions/attest: Sigstore signing certificate
      attestations: write   # actions/attest: store the attestation

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0    # scripts/version.py counts the commits since the release tag

      - uses: actions/download-artifact@v8
        with:
          pattern: shims-*
          path: build/shims

      # Releases track WPILib: a v* tag must be v<wpilibVersion> from natives.json
      - name: Get version
        id: version
        run: |
          version="$(python3 scripts/version.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Checks the repository and builds every platform's archive in the build container
      # (docker/Dockerfile), exactly as a local build does, with the shims built above
      - name: Build archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHIMS_PREBUILT: 1
          REQUIRE_SHIMS: 1
        run: scripts/build-in-docker.sh "$VERSION"

      # Sign every non-PR build so any build promoted to a release carries its signature. Pull
      # requests from forks can't get the OIDC token signing needs.
      - name: Attest archives
        id: attest
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: |
            build/dist/*.zip
            build/dist/*.tar.gz
            build/dist/SHA256SUMS

      - name: Save the attestation next to each archive
        if: github.event_name != 'pull_request'
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          for asset in build/dist/*.zip build/dist/*.tar.gz build/dist/SHA256SUMS; do
            cp "$BUNDLE" "$asset.sigstore.json"
          done
          ls -l build/dist/

      - uses: actions/upload-artifact@v7
        with:
          name: wpilib-labview-${{ steps.version.outputs.version }}
          path: build/dist/
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}   # alpha and beta releases
          body: |
            The LabVIEW add-ons for WPILib ${{ github.ref_name }}. Extract the archive for your
            platform into a LabVIEW add-ons location; see the
            [README](https://github.com/${{ github.repository }}#installing).
            `wpilib-labview-systemcore.zip` is for robots, which get it with systemcore-labview.

            `SHA256SUMS` lists every archive's hash. Each `.sigstore.json` file is the signed build
            provenance of the file next to it:
            `gh attestation verify <file> --repo ${{ github.repository }} --bundle <file>.sigstore.json`
