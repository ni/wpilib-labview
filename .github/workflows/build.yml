name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: >-
          Release this commit of main: tag it v<wpilibVersion>, or v<wpilibVersion>.<n> after an
          earlier release built against the same WPILib, and publish the archives
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The version to build, and for a release its tag (scripts/version.py), worked out first so a
  # release that can't be made fails before anything is built
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # the release tags, and the commits since the last one
      - name: Get version
        id: version
        env:
          RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        run: |
          if [ "$RELEASE" = true ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Releases are made from main, not $GITHUB_REF"
              exit 1
            fi
            tag="$(python3 scripts/version.py --next-tag)"
            version="$(python3 scripts/version.py --tag "$tag")"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            version="$(python3 scripts/version.py)"
          else
            tag=""
            version="$(python3 scripts/version.py)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$([ -n "$tag" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Version $version${tag:+, released as $tag}" | tee -a "$GITHUB_STEP_SUMMARY"

  # The shim libraries (src/), built like WPILib builds its own native code: Linux in WPILib's
  # containers (docker/wpilib-*), Windows and macOS on their runners
  shims-linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        platform: [ linuxsystemcore, linuxx86-64, linuxarm64 ]
    name: Shims - ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build shims
        env:
          PLATFORM: ${{ matrix.platform }}
        run: scripts/docker-shims.sh "$PLATFORM"
      - uses: actions/upload-artifact@v7
        with:
          name: shims-${{ matrix.platform }}
          path: build/shims/shims-${{ matrix.platform }}/
          if-no-files-found: error

  shims-windows:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        platform: [ windowsx86-64, windowsarm64 ]
    name: Shims - ${{ matrix.platform }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Build shims
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          PYTHON: python
        run: scripts/build-shims.sh "$PLATFORM"
      - uses: actions/upload-artifact@v7
        with:
          name: shims-${{ matrix.platform }}
          path: build/shims/shims-${{ matrix.platform }}/
          if-no-files-found: error

  shims-macos:
    needs: version
    name: Shims - osxuniversal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build shims
        run: scripts/build-shims.sh osxuniversal
      - uses: actions/upload-artifact@v7
        with:
          name: shims-osxuniversal
          path: build/shims/shims-osxuniversal/
          if-no-files-found: error

  build:
    needs: [ version, shims-linux, shims-windows, shims-macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # actions/attest: Sigstore signing certificate
      attestations: write   # actions/attest: store the attestation

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: shims-*
          path: build/shims

      # Checks the repository and builds every platform's archive in the build container
      # (docker/Dockerfile), exactly as a local build does, with the shims built above
      - name: Build archives
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHIMS_PREBUILT: 1
          REQUIRE_SHIMS: 1
        run: scripts/build-in-docker.sh "$VERSION"

      # Sign every non-PR build so any build promoted to a release carries its signature. Pull
      # requests from forks can't get the OIDC token signing needs.
      - name: Attest archives
        id: attest
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: |
            build/dist/*.zip
            build/dist/*.tar.gz
            build/dist/SHA256SUMS

      - name: Save the attestation next to each archive
        if: github.event_name != 'pull_request'
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          for asset in build/dist/*.zip build/dist/*.tar.gz build/dist/SHA256SUMS; do
            cp "$BUNDLE" "$asset.sigstore.json"
          done
          ls -l build/dist/

      - uses: actions/upload-artifact@v7
        with:
          name: wpilib-labview-${{ needs.version.outputs.version }}
          path: build/dist/
          retention-days: 90

  release:
    if: needs.version.outputs.release == 'true'
    needs: [ version, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Creates the tag on this commit when the release came from the Release input
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}   # alpha and beta releases
          body: |
            The LabVIEW add-ons for WPILib ${{ needs.version.outputs.tag }}. Extract the archive for your
            platform into a LabVIEW add-ons location; see the
            [README](https://github.com/${{ github.repository }}#installing).
            `wpilib-labview-systemcore.zip` is for robots, which get it with systemcore-labview.

            `SHA256SUMS` lists every archive's hash. Each `.sigstore.json` file is the signed build
            provenance of the file next to it:
            `gh attestation verify <file> --repo ${{ github.repository }} --bundle <file>.sigstore.json`
